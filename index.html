    :root {

      50% { transform: translateY(-20px) scale(1.05); }

    @keyframes pulseGlow {

      <button type="submit" class="btn-app-main">ENTRAR A LA APP</button>
      
      <button type="button" class="btn-app-main" onclick="redirectToDidit()" style="background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); margin-top: 10px;">
        🆔 VERIFICAR CON DIDIT
      </button>
    </form>
    
    <form id="form-signup" class="form-step" onsubmit="handleSignup(event)">
      <div class="input-group">
        <input type="email" id="regEmail" class="input-app" placeholder="Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="regPass" class="input-app" placeholder="Contraseña (mínimo 6 caracteres)" required>
      </div>
      <button type="submit" class="btn-app-main">CREAR CUENTA</button>
    </form>
  </div>
</div>

<!-- INTERFAZ PRINCIPAL -->
<div id="app-interface" class="app-interface hide">
  <header class="interface-header">
    <h2 style="font-size: 20px; font-weight: 900; background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ONLYBUBBLE</h2>
    <img id="topUserAvatar" src="" alt="Avatar" class="user-avatar-top" onclick="openInstagramProfile()">
  </header>

  <!-- SECCIÓN DESCUBRIR (SWIPE) -->
  <div id="view-discover" class="app-section-view active">
    <div class="matches-bubbles-bar" id="matchesBubblesContainer">
      <!-- Creado dinámicamente -->
    </div>

    <div class="profile-card-container" id="tinderCard">
      <img id="cardProfileImg" src="" alt="Perfil" class="profile-bg-img">
      <div class="profile-gradient-overlay"></div>
      <div class="profile-info-content">
        <div class="profile-name-age" id="cardProfileName">Cargando...</div>
        <div class="profile-location" id="cardProfileLocation"><span>📍</span> VRChat Universe</div>
      </div>
    </div>

    <div class="voting-buttons-bar">
      <button class="action-bubble-btn dislike" onclick="handleDislike()">✕ Omitir</button>
      <button class="action-bubble-btn like" onclick="handleLike()">❤</button>
    </div>
  </div>

  <!-- SECCIÓN CHAT -->
  <div id="view-chat" class="app-section-view">
    <div class="chat-layout" id="chatMainListContainer">
      <div style="padding: 14px; font-weight: 800; border-bottom: 1px solid var(--glass-border);">Mensajes y Chats</div>
      <div class="chat-conversations-list" id="chatConversationsList">
        <!-- Chats dinámicos -->
      </div>
    </div>

    <div class="chat-active-view" id="chatActiveView">
      <div class="chat-active-header">
        <button class="chat-back-btn" onclick="closeActiveChat()">←</button>
        <img id="activeChatAvatar" src="" class="sublist-user-avatar" alt="">
        <div>
          <div id="activeChatName" class="sublist-user-name">Usuario</div>
          <div style="font-size: 10px; color: #10b981;">Online en VRChat</div>
        </div>
      </div>
      <div class="chat-messages-container" id="chatMessagesContainer">
        <!-- Mensajes -->
      </div>
      <div class="chat-input-bar">
        <input type="text" id="chatInputField" class="chat-input-field" placeholder="Escribe un mensaje...">
        <button class="chat-send-btn" onclick="sendChatMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav-bar">
    <button class="nav-item active" onclick="switchAppTab('discover', this)">
      <span class="nav-icon">🔥</span>
      <span>Explorar</span>
    </button>
    <button class="nav-item" onclick="switchAppTab('chat', this)">
      <span class="nav-icon">💬</span>
      <span>Chat</span>
    </button>
    <button class="nav-item" onclick="openSettingsPanel()">
      <span class="nav-icon">⚙️</span>
      <span>Ajustes</span>
    </button>
  </nav>
</div>

<!-- PANTALLA DE PERFIL TIPO INSTAGRAM -->
<div id="instagramProfileScreen" class="instagram-profile-screen">
  <div class="ig-header-bar">
    <button class="chat-back-btn" onclick="closeInstagramProfile()">←</button>
    <div class="ig-username-title" id="igHeaderTitle">Mi Perfil</div>
    <div style="width: 24px;"></div>
  </div>

  <div class="ig-profile-body">
    <div class="ig-top-info">
      <img id="igAvatarImg" src="" alt="Avatar" class="ig-avatar-large">
      <div class="ig-stats-box">
        <div>
          <div class="ig-stat-num" id="statMatchesCount">0</div>
          <div class="ig-stat-label" onclick="openSublist('matches')">Matches</div>
        </div>
        <div>
          <div class="ig-stat-num" id="statFriendsCount">0</div>
          <div class="ig-stat-label" onclick="openSublist('friends')">Amigos</div>
        </div>
        <div>
          <div class="ig-stat-num" id="statFollowersCount">0</div>
          <div class="ig-stat-label" onclick="openSublist('followers')">Seguidores</div>
        </div>
      </div>
    </div>

    <div class="ig-bio-section">
      <div class="ig-fullname" id="igFullName">Nombre</div>
      <div class="ig-handle-tag" id="igHandle">@handle</div>
      <div class="ig-bio-text" id="igBioText">Biografía de usuario...</div>
      <div class="ig-vr-specs" id="igVrSpecs">🥽 Gafas VR: Quest 2</div>
    </div>

    <div class="ig-action-buttons" id="igActionButtonsContainer">
      <button class="ig-btn-edit" onclick="openEditProfile()">Editar Perfil</button>
    </div>

    <div class="ig-tabs-bar">
      <button class="ig-tab active">🥽</button>
    </div>

    <div class="ig-grid-gallery">
      <div class="ig-grid-item"><img src="logo.png" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'"></div>
      <div class="ig-grid-item">✨</div>
      <div class="ig-grid-item">🎮</div>
    </div>
  </div>
</div>

<!-- SUB-MODAL INTERACTIVO DE LISTAS (SEGUIDORES / MATCHES / AMIGOS) -->
<div id="sublistModal" class="sublist-modal">
  <div class="sublist-header">
    <h3 id="sublistTitle" style="font-size: 16px; font-weight: 800;">Lista</h3>
    <button class="chat-back-btn" onclick="closeSublist()">✕</button>
  </div>
  <div class="sublist-container" id="sublistContentContainer">
    <!-- Renderizado dinámico con opción de perfil y eliminar -->
  </div>
</div>

<!-- PANEL LATERAL DE AJUSTES -->
<div id="settingsBackdrop" class="settings-modal-backdrop" onclick="closeSettingsPanel()"></div>
<div id="settingsSlidePanel" class="settings-slide-panel">
  <div>
    <div class="panel-header">
      <h2>Ajustes</h2>
      <button class="panel-close-btn" onclick="closeSettingsPanel()">✕</button>
    </div>
    <div class="panel-menu-items">
      <button class="panel-menu-btn" onclick="openEditProfile(); closeSettingsPanel();">✏️ Editar Perfil</button>
      <button class="panel-menu-btn" onclick="alert('OnlyBubbleVR v1.2 - Conectando realidades')">ℹ️ Acerca de</button>
    </div>
  </div>
  <button class="panel-menu-btn panel-logout-btn" onclick="handleLogout()">🚪 Cerrar Sesión</button>
</div>

<script>
  // Control de pestañas de autenticación
  function switchAuthTab(tab) {
    document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup-btn').classList.toggle('active', tab === 'signup');
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-signup').classList.toggle('active', tab === 'signup');
  }

  // --- INICIO DE SESIÓN CON SUPABASE (IDs corregidos: authEmail y authPass) ---
  async function handleLogin(e) {
    e.preventDefault();
    
    const emailInput = document.getElementById('authEmail');
    const passwordInput = document.getElementById('authPass');

    if (!emailInput || !passwordInput) {
      alert("No se encontraron los campos de correo o contraseña en el HTML.");
      return;
    }

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value,
      });

      if (error) {
        alert("Error al iniciar sesión: " + error.message);
        return;
      }

      alert("¡Inicio de sesión exitoso!");
      location.reload(); 

    } catch (err) {
      console.error("Error inesperado:", err);
      alert("Ocurrió un error inesperado al conectar con Supabase.");
    }
  }

  // --- REGISTRO CON SUPABASE (IDs corregidos: regEmail y regPass) ---
  async function handleSignup(e) {
    e.preventDefault();

    const emailInput = document.getElementById('regEmail');
    const passwordInput = document.getElementById('regPass');

    if (!emailInput || !passwordInput) {
      alert("No se encontraron los campos de registro en el HTML.");
      return;
    }

    try {
      const { data, error } = await supabase.auth.signUp({
        email: emailInput.value,
        password: passwordInput.value,
      });

      if (error) {
        alert("Error en el registro: " + error.message);
        return;
      }

      alert("¡Cuenta creada con éxito! Revisa tu correo o inicia sesión.");
      switchAuthTab('login');

    } catch (err) {
      console.error("Error inesperado:", err);
      alert("Ocurrió un error inesperado al registrarse.");
    }
  }

  function redirectToDidit() { alert("Redirigiendo a verificación Didit..."); }
  
  function switchAppTab(tab, btn) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-discover').classList.toggle('active', tab === 'discover');
    document.getElementById('view-chat').classList.toggle('active', tab === 'chat');
  }

  function openInstagramProfile() {
    document.getElementById('instagramProfileScreen').classList.add('active');
  }
  function closeInstagramProfile() {
    document.getElementById('instagramProfileScreen').classList.remove('active');
  }

  function openSettingsPanel() {
    document.getElementById('settingsBackdrop').classList.add('active');
    document.getElementById('settingsSlidePanel').classList.add('active');
  }
  function closeSettingsPanel() {
    document.getElementById('settingsBackdrop').classList.remove('active');
    document.getElementById('settingsSlidePanel').classList.remove('active');
  }

  function openSublist(type) {
    const modal = document.getElementById('sublistModal');
    const title = document.getElementById('sublistTitle');
    const container = document.getElementById('sublistContentContainer');
    
    title.innerText = type === 'matches' ? 'Tus Matches' : type === 'friends' ? 'Tus Amigos' : 'Tus Seguidores';
    modal.classList.add('active');
    
    container.innerHTML = `
      <div class="sublist-user-row">
        <div class="sublist-user-info" onclick="alert('Abriendo perfil del usuario...')">
          <img src="https://placehold.co/100x100/120b24/a855f7?text=VR" class="sublist-user-avatar">
          <div>
            <div class="sublist-user-name">CyberGirl_VR</div>
            <div class="sublist-user-handle">@cybervr</div>
          </div>
        </div>
        <button class="btn-remove-connection" onclick="alert('Eliminado de la lista'); event.stopPropagation();">Eliminar</button>
      </div>
    `;
  }
  function closeSublist() {
    document.getElementById('sublistModal').classList.remove('active');
  }

  function openEditProfile() { alert("Abriendo editor de perfil..."); }
  function handleDislike() { alert("Omitido"); }
  function handleLike() { alert("¡Nuevo Match!"); }
  function closeActiveChat() { document.getElementById('chatActiveView').classList.remove('active'); }
  function sendChatMessage() { alert("Mensaje enviado"); }
  
  // --- CIERRE DE SESIÓN CON SUPABASE ---
  async function handleLogout() {
    const { error } = await supabase.auth.signOut();
    if (error) {
      console.error("Error al cerrar sesión:", error.message);
    }
    location.reload();
  }
</script>
</body>
</html>
