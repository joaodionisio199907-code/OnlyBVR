<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ONLYBUBBLEVR</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OnlyBubbleVR">
  <link rel="apple-touch-icon" href="logo.png">
  
  <!-- SDK de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #030208;
      --glass-card: rgba(18, 11, 36, 0.65);
      --glass-border: rgba(168, 85, 247, 0.35);
      --neon-cyan: #00f2fe;
      --neon-pink: #ec4899;
      --neon-purple: #a855f7;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --grad-main: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #00f2fe 100%);
      --radius-bubble: 28px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
      -webkit-tap-highlight-color: transparent; 
    }

    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh; 
      padding-bottom: 90px; 
    }

    #auth-screen { 
      position: fixed; 
      inset: 0; 
      background: var(--bg); 
      z-index: 999; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 24px; 
      overflow-y: auto;
    }

    #auth-screen.hide { display: none; }

    .app-bg-glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; }
    .orb-1 { top: -10%; left: -10%; width: 320px; height: 320px; background: #8b5cf6; }
    .orb-2 { bottom: -10%; right: -10%; width: 380px; height: 380px; background: #ec4899; }

    .app-title-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; text-align: center; }
    .main-logo-img { width: 90px; height: 90px; border-radius: 20px; margin-bottom: 12px; object-fit: cover; }

    .app-title-header h1 {
      font-size: 26px;
      font-weight: 900;
      background: var(--grad-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-card-app { 
      background: var(--glass-card); 
      backdrop-filter: blur(30px); 
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border); 
      border-radius: var(--radius-bubble); 
      padding: 24px; 
      width: 100%; 
      max-width: 380px; 
    }

    .auth-tabs { display: flex; background: rgba(0, 0, 0, 0.4); padding: 4px; border-radius: 16px; margin-bottom: 20px; }
    .auth-tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; border-radius: 12px; }
    .auth-tab-btn.active { background: var(--grad-main); color: #fff; }

    .input-group { position: relative; margin-bottom: 14px; }
    .input-app { width: 100%; padding: 16px; background: rgba(8, 5, 20, 0.7); border: 1px solid var(--glass-border); border-radius: 16px; color: #fff; font-size: 14px; outline: none; }

    .btn-app-main { 
      padding: 16px; 
      border-radius: 16px; 
      font-weight: 800; 
      background: var(--grad-main); 
      color: #fff; 
      border: none; 
      width: 100%; 
      font-size: 14px; 
      margin-top: 8px;
      cursor: pointer;
    }

    .form-step { display: none; }
    .form-step.active { display: block; }

    .header { position: sticky; top: 0; z-index: 50; background: rgba(3, 2, 8, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
    .app-body { max-width: 480px; margin: 0 auto; padding: 16px; }
    .page { display: none; }
    .page.active { display: block; }

    .post-card { background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: 22px; padding: 16px; margin-bottom: 16px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100vw; background: rgba(8, 8, 16, 0.92); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .nav-btn.active { color: var(--neon-pink); }
  </style>
</head>
<body>

<div class="app-bg-glow">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div id="auth-screen">
  <div class="app-title-header">
    <img src="logo.png" alt="OnlyBubble Logo" class="main-logo-img" onerror="this.src='https://picsum.photos/100'">
    <h1>ONLYBUBBLEVR</h1>
  </div>

  <div class="auth-card-app">
    <div class="auth-tabs">
      <button id="tab-login-btn" class="auth-tab-btn active" onclick="switchAuthTab('login')">Iniciar Sesión</button>
      <button id="tab-signup-btn" class="auth-tab-btn" onclick="switchAuthTab('signup')">Crear Cuenta</button>
    </div>

    <form id="form-login" class="form-step active" onsubmit="handleLogin(event)">
      <div class="input-group">
        <input type="email" id="authEmail" class="input-app" placeholder="Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="authPass" class="input-app" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn-app-main">ENTRAR A LA APP</button>
      
      <button type="button" class="btn-app-main" onclick="redirectToDidit()" style="background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);">
        🆔 VERIFICAR / ENTRAR CON DIDIT
      </button>
    </form>

    <form id="form-signup" class="form-step" onsubmit="handleSignUp(event)">
      <div class="input-group">
        <input type="email" id="signupEmail" class="input-app" placeholder="Tu correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="signupPass" class="input-app" placeholder="Crea tu contraseña" required>
      </div>
      <button type="submit" class="btn-app-main">REGISTRARME Y VERIFICAR</button>
    </form>
  </div>
</div>

<header class="header">
  <div style="font-weight:900;">OnlyBubble<span style="color:var(--neon-pink);">VR</span></div>
  <button onclick="handleLogout()" style="background:none; border:none; color:#fff; font-size:12px;">🚪 Salir</button>
</header>

<div class="app-body">
  <section id="feed" class="page active">
    <div class="post-card">
      <h3>¡Bienvenido a OnlyBubbleVR!</h3>
      <p style="font-size:12px; color:var(--text-muted); margin-top:6px;">Sesión iniciada correctamente.</p>
    </div>
  </section>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active"><span style="font-size:18px;">📰</span><span>Inicio</span></button>
</nav>

<script>
  const SUPABASE_URL = "https://wzpmgtkabsncpzpvweja.supabase.co";
  const SUPABASE_KEY = "sb_publishable_y9Yrqzf1QabeTeQV4DauBQ_tWgrL0li";
  
  // URL de tu flujo activo en Didit Console
  const DIDIT_FLOW_URL = "https://verify.didit.me/u/SJ4nOmHXTY2CwxwX9iSFqg";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function switchAuthTab(mode) {
    document.getElementById('tab-login-btn').classList.toggle('active', mode === 'login');
    document.getElementById('tab-signup-btn').classList.toggle('active', mode === 'signup');
    document.getElementById('form-login').classList.toggle('active', mode === 'login');
    document.getElementById('form-signup').classList.toggle('active', mode === 'signup');
  }

  function redirectToDidit() {
    window.location.href = DIDIT_FLOW_URL;
  }

  // COMPROBACIÓN AUTOMÁTICA AL ABRIR LA APP
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      await checkUserVerificationAndEnter(session.user);
    }
  });

  // VALIDA SI EL USUARIO ESTÁ VERIFICADO EN 'profiles'
  async function checkUserVerificationAndEnter(user) {
    const { data: profile, error } = await db
      .from('profiles')
      .select('is_age_verified')
      .eq('id', user.id)
      .single();

    if (error || !profile || !profile.is_age_verified) {
      alert("⚠️ Tu cuenta requiere verificación de edad (+18) para poder acceder.");
      redirectToDidit();
      return;
    }

    document.getElementById('auth-screen').classList.add('hide');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPass').value;

    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) return alert("Error al entrar: " + error.message);

    await checkUserVerificationAndEnter(data.user);
  }

  async function handleSignUp(e) {
    e.preventDefault();
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPass').value;

    const { data, error } = await db.auth.signUp({ email, password });
    if (error) return alert("Error al registrarse: " + error.message);
    
    if (data.user) {
      // Registra al usuario como NO verificado
      await db.from('profiles').upsert({
        id: data.user.id,
        is_age_verified: false
      });

      alert("Cuenta creada. Redirigiendo a verificación de identidad...");
      redirectToDidit();
    }
  }

  async function handleLogout() {
    await db.auth.signOut();
    document.getElementById('auth-screen').classList.remove('hide');
  }
</script>

</body>
</html>
