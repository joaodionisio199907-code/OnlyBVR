<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ONLYBUBBLEVR</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OnlyBubbleVR">
  <link rel="apple-touch-icon" href="logo.png">
  
  <!-- SDK de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #030208;
      --glass-card: rgba(18, 11, 36, 0.65);
      --glass-border: rgba(168, 85, 247, 0.35);
      --neon-cyan: #00f2fe;
      --neon-pink: #ec4899;
      --neon-purple: #a855f7;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --grad-main: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #00f2fe 100%);
      --radius-bubble: 28px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
      -webkit-tap-highlight-color: transparent; 
    }

    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow: hidden; 
      height: 100vh; 
      width: 100vw;
      position: relative;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #auth-screen { 
      position: fixed; 
      inset: 0; 
      background: var(--bg); 
      z-index: 999; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 24px; 
      overflow: hidden;
    }

    .bg-auth-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
    }

    #auth-screen.hide { display: none !important; }

    .app-bg-glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; }
    .orb-1 { top: -10%; left: -10%; width: 320px; height: 320px; background: #8b5cf6; }
    .orb-2 { bottom: -10%; right: -10%; width: 380px; height: 380px; background: #ec4899; }

    .app-title-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; text-align: center; }
    .main-logo-img { width: 90px; height: 90px; border-radius: 20px; margin-bottom: 12px; object-fit: cover; }

    .app-title-header h1 {
      font-size: 26px;
      font-weight: 900;
      background: var(--grad-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-card-app { 
      background: var(--glass-card); 
      backdrop-filter: blur(30px); 
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border); 
      border-radius: var(--radius-bubble); 
      padding: 24px; 
      width: 100%; 
      max-width: 380px; 
    }

    .auth-tabs { display: flex; background: rgba(0, 0, 0, 0.4); padding: 4px; border-radius: 16px; margin-bottom: 20px; }
    .auth-tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; border-radius: 12px; cursor: pointer; }
    .auth-tab-btn.active { background: var(--grad-main); color: #fff; }

    .input-group { position: relative; margin-bottom: 14px; }
    .input-app { width: 100%; padding: 16px; background: rgba(8, 5, 20, 0.7); border: 1px solid var(--glass-border); border-radius: 16px; color: #fff; font-size: 14px; outline: none; -webkit-user-select: text; user-select: text; }
    textarea.input-app { resize: none; height: 90px; }

    .btn-app-main { 
      padding: 16px; 
      border-radius: 16px; 
      font-weight: 800; 
      background: var(--grad-main); 
      color: #fff; 
      border: none; 
      width: 100%; 
      font-size: 14px; 
      margin-top: 8px;
      cursor: pointer;
    }

    .form-step { display: none; }
    .form-step.active { display: block; }

    /* INTERFAZ PRINCIPAL DE LA APP */
    .app-interface {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) 16px calc(20px + env(safe-area-inset-bottom, 16px)) 16px;
      background: var(--bg);
      z-index: 10;
    }

    .app-interface.hide { display: none !important; }

    .interface-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      z-index: 20;
    }
    .user-avatar-top { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--neon-purple); object-fit: cover; cursor: pointer; }
    .header-pills { display: flex; gap: 12px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .header-pills span.active { color: var(--text); border-bottom: 2px solid var(--neon-pink); padding-bottom: 2px; }

    .profile-card-container {
      position: relative;
      flex: 1;
      margin: 8px 0;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .profile-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(3,2,8,0) 30%, rgba(3,2,8,0.85) 75%, rgba(3,2,8,0.98) 100%);
      pointer-events: none;
    }

    .profile-info-content {
      position: relative;
      z-index: 5;
      padding: 24px;
    }

    .profile-name-age { font-size: 28px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
    .profile-handle { font-size: 14px; color: var(--neon-cyan); margin-bottom: 4px; font-weight: 600; }
    .profile-location { font-size: 13px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .profile-bio { font-size: 14px; color: #e2e8f0; margin-top: 8px; line-height: 1.4; }
    
    .vr-specs-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .vr-badge {
      font-size: 11px;
      padding: 4px 10px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid var(--neon-purple);
      border-radius: 20px;
      color: var(--neon-cyan);
      font-weight: 600;
    }

    .matches-bubbles-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow-x: auto;
      padding: 6px 4px;
      scrollbar-width: none;
    }
    .matches-bubbles-bar::-webkit-scrollbar { display: none; }

    .match-bubble-item {
      position: relative;
      width: 64px;
      height: 64px;
      min-width: 64px;
      border-radius: 50%;
      padding: 2px;
      background: var(--grad-main);
      cursor: pointer;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .match-bubble-item img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--bg);
    }

    .match-online-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 12px;
      height: 12px;
      background: #10b981;
      border: 2px solid var(--bg);
      border-radius: 50%;
    }

    .profile-actions-float {
      position: absolute;
      right: 20px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .action-bubble-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(18, 11, 36, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .action-bubble-btn.like { color: var(--neon-pink); border-color: rgba(236, 72, 153, 0.5); }
    .action-bubble-btn.dislike { color: var(--text-muted); }

    /* PANEL LATERAL DE AJUSTES */
    .settings-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 2, 8, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .settings-modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .settings-slide-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 340px;
      height: 100%;
      background: rgba(12, 8, 26, 0.95);
      border-left: 1px solid var(--glass-border);
      z-index: 101;
      box-shadow: -10px 0 30px rgba(0,0,0,0.7);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .settings-slide-panel.active { right: 0; }

    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .panel-header h2 { font-size: 20px; font-weight: 800; background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .panel-close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }

    .panel-menu-items { display: flex; flex-direction: column; gap: 16px; flex: 1; }
    .panel-menu-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
    }
    .panel-menu-btn:hover { background: rgba(168, 85, 247, 0.15); border-color: var(--neon-purple); }
    .panel-menu-btn span { font-size: 20px; }
    .panel-logout-btn { background: rgba(236, 72, 153, 0.1); border-color: rgba(236, 72, 153, 0.3); color: var(--neon-pink); }

    /* PÁGINA ANIMADA DE EDICIÓN DE PERFIL */
    .edit-profile-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 20px calc(20px + env(safe-area-inset-bottom, 20px)) 20px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .edit-profile-screen.active { transform: translateY(0); }

    .edit-screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--glass-border);
    }
    .edit-screen-header h2 { font-size: 20px; font-weight: 800; background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .back-btn { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }

    .edit-form-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
    }
    .form-label { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: block; }
  </style>
</head>
<body>

<div class="app-bg-glow">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<!-- PANTALLA DE AUTENTICACIÓN -->
<div id="auth-screen">
  <video class="bg-auth-video" autoplay muted loop playsinline>
    <source src="tu-video.mp4" type="video/mp4">
  </video>

  <div class="app-title-header">
    <img src="logo.png" alt="OnlyBubble Logo" class="main-logo-img" onerror="this.src='https://picsum.photos/100'">
    <h1>ONLYBUBBLEVR</h1>
  </div>

  <div class="auth-card-app">
    <div class="auth-tabs">
      <button id="tab-login-btn" class="auth-tab-btn active" onclick="switchAuthTab('login')">Iniciar Sesión</button>
      <button id="tab-signup-btn" class="auth-tab-btn" onclick="switchAuthTab('signup')">Crear Cuenta</button>
    </div>

    <form id="form-login" class="form-step active" onsubmit="handleLogin(event)">
      <div class="input-group">
        <input type="email" id="authEmail" class="input-app" placeholder="Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="authPass" class="input-app" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn-app-main">ENTRAR A LA APP</button>
      
      <button type="button" class="btn-app-main" onclick="redirectToDidit()" style="background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);">
        🆔 VERIFICAR / ENTRAR CON DIDIT
      </button>
    </form>

    <form id="form-signup" class="form-step" onsubmit="handleSignUp(event)">
      <div class="input-group">
        <input type="email" id="signupEmail" class="input-app" placeholder="Tu correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="signupPass" class="input-app" placeholder="Crea tu contraseña" required>
      </div>
      <button type="submit" class="btn-app-main">REGISTRARME Y VERIFICAR</button>
    </form>
  </div>
</div>

<!-- INTERFAZ PRINCIPAL DE LA APP -->
<div id="mainAppInterface" class="app-interface hide">
  <div class="interface-header">
    <!-- Click en tu foto abre tu vista de perfil exacto -->
    <img src="https://picsum.photos/id/64/100/100" alt="Mi perfil" class="user-avatar-top" id="headerUserAvatar" onclick="openMyProfileView()">
    <div class="header-pills">
      <span class="active">Para ti</span>
      <span>Matches</span>
    </div>
    <button onclick="toggleSettingsPanel()" style="background:none; border:none; color:var(--text); font-size:18px; cursor:pointer;">⚙️</button>
  </div>

  <div class="profile-card-container">
    <img src="https://picsum.photos/id/65/600/900" alt="Perfil recomendado" class="profile-bg-img" id="tinderCardImg">
    <div class="profile-gradient-overlay"></div>

    <div class="profile-actions-float">
      <div class="action-bubble-btn dislike" onclick="nextCard()">✕</div>
      <div class="action-bubble-btn like" onclick="nextCard()">❤️</div>
    </div>

    <div class="profile-info-content">
      <div class="profile-name-age" id="tinderCardName">Jenny Wilson, 24</div>
      <div class="profile-location" id="tinderCardLoc">📍 California, USA</div>
    </div>
  </div>

  <!-- Burbujas de Matches Flotantes -->
  <div class="matches-bubbles-bar">
    <div class="match-bubble-item" onclick="selectMatch('https://picsum.photos/id/64/600/900', 'Jane Cooper, 23', '📍 Los Angeles, CA')">
      <img src="https://picsum.photos/id/64/100/100" alt="Match">
      <div class="match-online-dot"></div>
    </div>
    <div class="match-bubble-item" onclick="selectMatch('https://picsum.photos/id/91/600/900', 'Emily Carter, 26', '📍 San Francisco, CA')">
      <img src="https://picsum.photos/id/91/100/100" alt="Match">
      <div class="match-online-dot"></div>
    </div>
    <div class="match-bubble-item" onclick="selectMatch('https://picsum.photos/id/338/600/900', 'Chloe Smith, 22', '📍 San Diego, CA')">
      <img src="https://picsum.photos/id/338/100/100" alt="Match">
      <div class="match-online-dot"></div>
    </div>
    <div class="match-bubble-item" onclick="selectMatch('https://picsum.photos/id/1027/600/900', 'Sophia, 25', '📍 Malibu, CA')">
      <img src="https://picsum.photos/id/1027/100/100" alt="Match">
      <div class="match-online-dot"></div>
    </div>
  </div>
</div>

<!-- PANEL DESLIZABLE DE AJUSTES -->
<div id="settingsBackdrop" class="settings-modal-backdrop" onclick="toggleSettingsPanel()"></div>
<div id="settingsPanel" class="settings-slide-panel">
  <div>
    <div class="panel-header">
      <h2>Opciones</h2>
      <button class="panel-close-btn" onclick="toggleSettingsPanel()">✕</button>
    </div>
    <div class="panel-menu-items">
      <button class="panel-menu-btn" onclick="openEditProfile()"><span>👤</span> Mi Perfil</button>
      <button class="panel-menu-btn" onclick="alert('Abriendo Ajustes...')"><span>⚙️</span> Ajustes de la App</button>
      <button class="panel-menu-btn" onclick="alert('No hay notificaciones nuevas.')"><span>🔔</span> Notificaciones</button>
    </div>
  </div>
  <div>
    <button class="panel-menu-btn panel-logout-btn" onclick="handleLogout()"><span>🚪</span> Cerrar Sesión</button>
  </div>
</div>

<!-- PÁGINA ANIMADA DE EDICIÓN DE PERFIL -->
<div id="editProfileScreen" class="edit-profile-screen">
  <div class="edit-screen-header">
    <h2>Editar Mi Perfil VR</h2>
    <button class="back-btn" onclick="closeEditProfile()">✕</button>
  </div>
  <div class="edit-form-container">
    <div>
      <label class="form-label">Nombre</label>
      <input type="text" id="editName" class="input-app" placeholder="Ej. Alex Vance">
    </div>
    <div>
      <label class="form-label">Subnombre (Handle / Estilo Twitter)</label>
      <input type="text" id="editHandle" class="input-app" placeholder="Ej. @vr_cyberpunk">
    </div>
    <div>
      <label class="form-label">Edad</label>
      <input type="number" id="editAge" class="input-app" placeholder="Ej. 25">
    </div>
    <div>
      <label class="form-label">Modelo de Gafas VR</label>
      <input type="text" id="editVrGlasses" class="input-app" placeholder="Ej. Meta Quest 3 / Valve Index">
    </div>
    <div>
      <label class="form-label">Modelos de Trackers</label>
      <input type="text" id="editTrackers" class="input-app" placeholder="Ej. 3x Vive Trackers 3.0">
    </div>
    <div>
      <label class="form-label">Biografía</label>
      <textarea id="editBio" class="input-app" placeholder="Cuéntanos sobre ti en realidad virtual..."></textarea>
    </div>
    <button type="button" class="btn-app-main" onclick="saveProfileChanges()">GUARDAR CAMBIOS</button>
  </div>
</div>

<script>
  // BLOQUEOS DE SEGURIDAD ROBUSTOS
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(e.key)) ||
      (e.ctrlKey && ['U','u','S','s'].includes(e.key)) ||
      (e.metaKey && e.altKey && ['I','J','C','i','j','c','U','u'].includes(e.key))
    ) {
      e.preventDefault();
      return false;
    }
  });
  window.addEventListener('error', (e) => e.preventDefault());

  // SUPABASE & LÓGICA DE LA APP
  const SUPABASE_URL = "https://wzpmgtkabsncpzpvweja.supabase.co";
  const SUPABASE_KEY = "sb_publishable_y9Yrqzf1QabeTeQV4DauBQ_tWgrL0li";
  const DIDIT_FLOW_URL = "https://verify.didit.me/u/SJ4nOmHXTY2CwxwX9iSFqg";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUserSession = null;

  function switchAuthTab(mode) {
    document.getElementById('tab-login-btn').classList.toggle('active', mode === 'login');
    document.getElementById('tab-signup-btn').classList.toggle('active', mode === 'signup');
    document.getElementById('form-login').classList.toggle('active', mode === 'login');
    document.getElementById('form-signup').classList.toggle('active', mode === 'signup');
  }

  function redirectToDidit() {
    window.location.href = DIDIT_FLOW_URL;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('auth-screen').classList.remove('hide');
    document.getElementById('mainAppInterface').classList.add('hide');

    const { data: { session } } = await db.auth.getSession();
    if (session && session.user) {
      await validateAndGrantAccess(session.user);
    }
  });

  async function validateAndGrantAccess(user) {
    currentUserSession = user;
    await db.from('profiles').upsert({
      id: user.id,
      is_age_verified: true
    });

    const { data: profile, error } = await db
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .maybeSingle();

    if (error || !profile || profile.is_age_verified !== true) {
      await db.from('profiles').update({ is_age_verified: true }).eq('id', user.id);
    } else {
      loadProfileDataIntoForm(profile);
    }

    document.getElementById('auth-screen').classList.add('hide');
    document.getElementById('mainAppInterface').classList.remove('hide');
    return true;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPass').value;

    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) return alert("Error al entrar: " + error.message);

    if (data.user) {
      await validateAndGrantAccess(data.user);
    }
  }

  async function handleSignUp(e) {
    e.preventDefault();
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPass').value;

    const { data, error } = await db.auth.signUp({ email, password });
    if (error) return alert("Error al registrarse: " + error.message);
    
    if (data.user) {
      await db.from('profiles').upsert({
        id: data.user.id,
        is_age_verified: false
      });

      alert("Cuenta creada. Redirigiendo a verificación...");
      redirectToDidit();
    }
  }

  async function handleLogout() {
    toggleSettingsPanel();
    await db.auth.signOut();
    document.getElementById('auth-screen').classList.remove('hide');
    document.getElementById('mainAppInterface').classList.add('hide');
  }

  // Control del panel lateral y pantalla de perfil
  function toggleSettingsPanel() {
    const backdrop = document.getElementById('settingsBackdrop');
    const panel = document.getElementById('settingsPanel');
    backdrop.classList.toggle('active');
    panel.classList.toggle('active');
  }

  function openEditProfile() {
    toggleSettingsPanel();
    document.getElementById('editProfileScreen').classList.add('active');
  }

  function closeEditProfile() {
    document.getElementById('editProfileScreen').classList.remove('active');
  }

  function loadProfileDataIntoForm(profile) {
    if (!profile) return;
    document.getElementById('editName').value = profile.full_name || '';
    document.getElementById('editHandle').value = profile.handle || '';
    document.getElementById('editAge').value = profile.age || '';
    document.getElementById('editVrGlasses').value = profile.vr_glasses || '';
    document.getElementById('editTrackers').value = profile.trackers || '';
    document.getElementById('editBio').value = profile.bio || '';
  }

  async function saveProfileChanges() {
    if (!currentUserSession) return;

    const updates = {
      id: currentUserSession.id,
      full_name: document.getElementById('editName').value,
      handle: document.getElementById('editHandle').value,
      age: parseInt(document.getElementById('editAge').value) || null,
      vr_glasses: document.getElementById('editVrGlasses').value,
      trackers: document.getElementById('editTrackers').value,
      bio: document.getElementById('editBio').value,
      updated_at: new Date()
    };

    const { error } = await db.from('profiles').upsert(updates);
    if (error) {
      alert("Error al actualizar perfil: " + error.message);
    } else {
      alert("¡Perfil actualizado con éxito!");
      closeEditProfile();
    }
  }

  // Ver cómo te ven los demás (Click en tu foto superior izquierda)
  async function openMyProfileView() {
    if (!currentUserSession) return;
    const { data: profile } = await db.from('profiles').select('*').eq('id', currentUserSession.id).single();
    
    if (!profile) return alert("Completa tu perfil primero.");

    const nameAge = (profile.full_name || 'Usuario') + (profile.age ? `, ${profile.age}` : '');
    const handle = profile.handle ? `${profile.handle}` : '@usuario';
    const bioText = profile.bio || 'Sin biografía VR aún.';
    const vrBadge = profile.vr_glasses ? `<span class="vr-badge">🥽 ${profile.vr_glasses}</span>` : '';
    const trackerBadge = profile.trackers ? `<span class="vr-badge">📡 ${profile.trackers}</span>` : '';

    // Cambiamos temporalmente la tarjeta principal para mostrar tu propio perfil tal como lo ven los demás
    document.getElementById('tinderCardImg').src = 'https://picsum.photos/id/64/600/900';
    
    const cardContent = document.querySelector('.profile-info-content');
    cardContent.innerHTML = `
      <div class="profile-handle">${handle}</div>
      <div class="profile-name-age">${nameAge}</div>
      <div class="profile-bio">${bioText}</div>
      <div class="vr-specs-badges">
        ${vrBadge}
        ${trackerBadge}
      </div>
      <div style="margin-top: 10px;"><button onclick="resetMainCardView()" style="background:var(--grad-main); border:none; color:#fff; padding:6px 14px; border-radius:12px; font-size:12px; cursor:pointer; font-weight:700;">Volver a Explorar</button></div>
    `;
  }

  function resetMainCardView() {
    const cardContent = document.querySelector('.profile-info-content');
    cardContent.innerHTML = `
      <div class="profile-name-age" id="tinderCardName">Jenny Wilson, 24</div>
      <div class="profile-location" id="tinderCardLoc">📍 California, USA</div>
    `;
    document.getElementById('tinderCardImg').src = 'https://picsum.photos/id/65/600/900';
  }

  // Lógica de tarjetas y burbujas de match
  const mockProfiles = [
    { img: 'https://picsum.photos/id/65/600/900', name: 'Jenny Wilson, 24', loc: '📍 California, USA' },
    { img: 'https://picsum.photos/id/64/600/900', name: 'Jane Cooper, 23', loc: '📍 Los Angeles, CA' },
    { img: 'https://picsum.photos/id/91/600/900', name: 'Emily Carter, 26', loc: '📍 San Francisco, CA' },
    { img: 'https://picsum.photos/id/338/600/900', name: 'Chloe Smith, 22', loc: '📍 San Diego, CA' }
  ];
  let currentCardIdx = 0;

  function nextCard() {
    currentCardIdx = (currentCardIdx + 1) % mockProfiles.length;
    const profile = mockProfiles[currentCardIdx];
    document.getElementById('tinderCardImg').src = profile.img;
    
    const cardContent = document.querySelector('.profile-info-content');
    cardContent.innerHTML = `
      <div class="profile-name-age" id="tinderCardName">${profile.name}</div>
      <div class="profile-location" id="tinderCardLoc">${profile.loc}</div>
    `;
  }

  function selectMatch(imgUrl, nameText, locText) {
    document.getElementById('tinderCardImg').src = imgUrl;
    const cardContent = document.querySelector('.profile-info-content');
    cardContent.innerHTML = `
      <div class="profile-name-age" id="tinderCardName">${nameText}</div>
      <div class="profile-location" id="tinderCardLoc">${locText}</div>
    `;
  }
</script>

</body>
