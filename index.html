<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ONLYBUBBLEVR</title>
  <meta name="description" content="OnlyBubbleVr es el punto de encuentro definitivo para jugadores de VRChat que quieren conectar fuera de los mundos virtuales. Explora perfiles, haz nuevas amistades y queda.">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OnlyBubbleVR">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Inicializa tu cliente de Supabase (Asegúrate de poner tus credenciales reales aquí)
    const SUPABASE_URL = 'https://wzpmgtkabsncpzpvweja.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_y9Yrqzf1QabeTeQV4DauBQ_tWgrL0li';
    // Usamos 'window.supabaseClient' para evitar conflictos de nombres duplicados
    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
  
  <style>
    :root {
      --bg: #030208;
      --glass-card: rgba(18, 11, 36, 0.65);
      --glass-border: rgba(168, 85, 247, 0.35);
      --neon-cyan: #00f2fe;
      --neon-pink: #ec4899;
      --neon-purple: #a855f7;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --grad-main: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #00f2fe 100%);
      --radius-bubble: 36px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
      -webkit-tap-highlight-color: transparent; 
    }

    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow: hidden; 
      height: 100vh; 
      width: 100vw;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: blur(90px); }
      50% { opacity: 0.9; filter: blur(110px); }
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    #auth-screen { 
      position: fixed; 
      inset: 0; 
      background: var(--bg); 
      z-index: 999; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 24px; 
      overflow: hidden;
      animation: fadeInScale 0.5s ease;
    }

    .bg-auth-video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
    }

    #auth-screen.hide { display: none !important; }

    .app-bg-glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; animation: floatOrb 8s infinite ease-in-out, pulseGlow 5s infinite alternate; }
    .orb-1 { top: -10%; left: -10%; width: 320px; height: 320px; background: #8b5cf6; }
    .orb-2 { bottom: -10%; right: -10%; width: 380px; height: 380px; background: #ec4899; animation-delay: -3s; }

    .app-title-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; text-align: center; }
    .main-logo-img { width: 90px; height: 90px; border-radius: 20px; margin-bottom: 12px; object-fit: cover; box-shadow: 0 0 20px rgba(168,85,247,0.4); }

    .app-title-header h1 {
      font-size: 26px;
      font-weight: 900;
      background: var(--grad-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-card-app { 
      background: var(--glass-card); 
      backdrop-filter: blur(30px); 
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border); 
      border-radius: var(--radius-bubble); 
      padding: 24px; 
      width: 100%; 
      max-width: 380px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .auth-tabs { display: flex; background: rgba(0, 0, 0, 0.4); padding: 4px; border-radius: 16px; margin-bottom: 20px; }
    .auth-tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; border-radius: 12px; cursor: pointer; }
    .auth-tab-btn.active { background: var(--grad-main); color: #fff; box-shadow: 0 4px 12px rgba(168,85,247,0.4); }

    .input-group { position: relative; margin-bottom: 14px; }
    .input-app { width: 100%; padding: 16px; background: rgba(8, 5, 20, 0.7); border: 1px solid var(--glass-border); border-radius: 16px; color: #fff; font-size: 14px; outline: none; user-select: text; }
    .input-app:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,242,254,0.3); }

    .btn-app-main { 
      padding: 16px; 
      border-radius: 16px; 
      font-weight: 800; 
      background: var(--grad-main); 
      color: #fff; 
      border: none; 
      width: 100%; 
      font-size: 14px; 
      margin-top: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168,85,247,0.4);
    }
    .btn-app-main:active { transform: scale(0.97); }

    .form-step { display: none; }
    .form-step.active { display: block; animation: fadeInScale 0.3s ease; }

    .app-interface {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) 16px calc(16px + env(safe-area-inset-bottom, 16px)) 16px;
      background: var(--bg);
      z-index: 10;
    }
    .app-interface.hide { display: none !important; }

    .interface-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      z-index: 20;
    }
    .user-avatar-top { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--neon-purple); object-fit: cover; cursor: pointer; box-shadow: 0 0 10px rgba(168,85,247,0.5); background: #111; }

    .bottom-nav-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(18, 11, 36, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 8px 12px;
      margin-top: 6px;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .nav-item span.nav-icon { font-size: 18px; }
    .nav-item.active { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,242,254,0.5); }
  </style>
</head>
<body>

<div class="app-bg-glow">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<!-- PANTALLA DE AUTENTICACIÓN -->
<div id="auth-screen">
  <!-- Si no tienes un video de fondo, puedes comentar o eliminar la etiqueta video -->
  <div class="app-title-header">
    <img src="logo.png" alt="OnlyBubble Logo" class="main-logo-img" onerror="this.src='https://placehold.co/100x100/120b24/a855f7?text=OB'">
    <h1>ONLYBUBBLEVR</h1>
  </div>

  <div class="auth-card-app">
    <div class="auth-tabs">
      <button id="tab-login-btn" class="auth-tab-btn active" onclick="switchAuthTab('login')">Iniciar Sesión</button>
      <button id="tab-signup-btn" class="auth-tab-btn" onclick="switchAuthTab('signup')">Crear Cuenta</button>
    </div>

    <form id="form-login" class="form-step active" onsubmit="handleLogin(event)">
      <div class="input-group">
        <input type="email" id="authEmail" class="input-app" placeholder="Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="authPass" class="input-app" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn-app-main">ENTRAR A LA APP</button>
    </form>
    
    <form id="form-signup" class="form-step" onsubmit="handleSignup(event)">
      <div class="input-group">
        <input type="email" id="regEmail" class="input-app" placeholder="Correo electrónico" required>
      </div>
      <div class="input-group">
        <input type="password" id="regPass" class="input-app" placeholder="Contraseña (mínimo 6 caracteres)" required>
      </div>
      <button type="submit" class="btn-app-main">CREAR CUENTA</button>
    </form>
  </div>
</div>

<!-- INTERFAZ PRINCIPAL -->
<div id="app-interface" class="app-interface hide">
  <header class="interface-header">
    <h2 style="font-size: 20px; font-weight: 900; background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ONLYBUBBLE</h2>
    <img id="topUserAvatar" src="" alt="Avatar" class="user-avatar-top">
  </header>

  <div style="flex:1; display:flex; align-items:center; justify-content:center; text-align:center;">
    <div>
      <h3>¡Bienvenido a OnlyBubbleVR!</h3>
      <p style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">Has iniciado sesión correctamente.</p>
    </div>
  </div>

  <nav class="bottom-nav-bar">
    <button class="nav-item active">
      <span class="nav-icon">🔥</span>
      <span>Explorar</span>
    </button>
    <button class="nav-item" onclick="handleLogout()">
      <span class="nav-icon">🚪</span>
      <span>Salir</span>
    </button>
  </nav>
</div>

<script>
  function switchAuthTab(tab) {
    document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup-btn').classList.toggle('active', tab === 'signup');
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-signup').classList.toggle('active', tab === 'signup');
  }

  // --- INICIO DE SESIÓN ---
  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPass').value;

    try {
      const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Error al iniciar sesión: " + error.message);
        return;
      }

      alert("¡Inicio de sesión exitoso!");
      document.getElementById('auth-screen').classList.add('hide');
      document.getElementById('app-interface').classList.remove('hide');

    } catch (err) {
      console.error("Error técnico detallado:", err);
      alert("Error técnico de Supabase: " + (err.message || JSON.stringify(err)));
    }
  }

  // --- REGISTRO ---
  async function handleSignup(e) {
    e.preventDefault();
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPass').value;

    try {
      const { data, error } = await window.supabaseClient.auth.signUp({ email, password });

      if (error) {
        alert("Error en el registro: " + error.message);
        return;
      }

      alert("¡Cuenta creada con éxito! Ya puedes iniciar sesión.");
      switchAuthTab('login');

    } catch (err) {
      console.error("Error técnico detallado:", err);
      alert("Error técnico de Supabase: " + (err.message || JSON.stringify(err)));
    }
  }

  // --- CERRAR SESIÓN ---
  async function handleLogout() {
    await window.supabaseClient.auth.signOut();
    document.getElementById('app-interface').classList.add('hide');
    document.getElementById('auth-screen').classList.remove('hide');
  }
</script>
</body>
</html>
