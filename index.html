<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OnlyBubbleVR — Metaverse Social Network</title>
  
  <!-- SDK de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #040409;
      --glass-card: rgba(20, 20, 38, 0.75);
      --glass-border: rgba(0, 242, 254, 0.25);
      --neon-cyan: #00f2fe;
      --neon-pink: #ff19b5;
      --neon-purple: #8a2be2;
      --text: #ffffff;
      --text-muted: #a0a0c0;
      --grad-main: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      --radius-bubble: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; min-height: 100vh; padding-bottom: 80px; }

    /* FONDO DE LUZ AMBIENTAL */
    .glow-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .glow-1 { position: absolute; top: -15%; right: -10%; width: 350px; height: 350px; background: radial-gradient(circle, rgba(0,242,254,0.2) 0%, transparent 70%); filter: blur(70px); }
    .glow-2 { position: absolute; bottom: 10%; left: -15%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,25,181,0.18) 0%, transparent 70%); filter: blur(80px); }

    /* PANTALLA DE LOGIN / AUTH */
    #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    #auth-screen.hide { animation: fadeOutAuth 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; pointer-events: none; }
    @keyframes fadeOutAuth { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); display: none; } }

    .auth-card { background: var(--glass-card); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: var(--radius-bubble); padding: 32px 24px; width: 100%; max-width: 380px; box-shadow: 0 0 40px rgba(0,242,254,0.15); }
    .auth-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--neon-pink); margin-bottom: 16px; box-shadow: 0 0 20px rgba(255,25,181,0.5); object-fit: cover; }
    
    .input-field { width: 100%; padding: 14px; background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); border-radius: 14px; color: #fff; font-size: 14px; outline: none; margin-bottom: 12px; }
    .input-field:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,242,254,0.3); }

    .gradient-text { background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-grad { padding: 14px 20px; border-radius: 16px; font-weight: 800; background: var(--grad-main); color: #fff; border: none; cursor: pointer; width: 100%; font-size: 14px; box-shadow: 0 0 20px rgba(138,43,226,0.4); }

    /* HEADER Y ESTRUCTURA */
    .header { position: sticky; top: 0; z-index: 50; background: rgba(4, 4, 9, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; }
    .brand-logo-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon-pink); }

    .app-body { max-width: 480px; margin: 0 auto; padding: 16px; }

    /* SECCIONES Y TRANSICIÓN */
    .page { display: none; }
    .page.active { display: block; animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* PUBLICACIONES Y TARJETAS */
    .create-post-card { background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: 20px; padding: 14px; margin-bottom: 16px; backdrop-filter: blur(15px); }
    .post-card { background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: 22px; padding: 16px; margin-bottom: 16px; backdrop-filter: blur(15px); }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--neon-cyan); object-fit: cover; }

    .chip { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-muted); white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--grad-main); color: #fff; border-color: transparent; }

    /* NAVEGACIÓN INFERIOR MOBILE */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100vw; background: rgba(8, 8, 16, 0.92); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 10px 0 14px; z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
    .nav-btn .icon { font-size: 20px; }
    .nav-btn.active { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); }
  </style>
</head>
<body>

<div class="glow-bg">
  <div class="glow-1"></div>
  <div class="glow-2"></div>
</div>

<!-- 1. PANTALLA AUTH / INICIO DE SESIÓN -->
<div id="auth-screen">
  <div class="auth-card">
    <img src="https://picsum.photos/200/200?random=88" alt="Logo" class="auth-logo">
    <h1 style="font-size:24px; margin-bottom:4px;">OnlyBubble<span class="gradient-text">VR</span></h1>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:20px;">Tu red social de avatares en el Metaverso</p>

    <input type="email" id="authEmail" class="input-field" placeholder="Correo electrónico">
    <input type="password" id="authPass" class="input-field" placeholder="Contraseña">
    
    <button class="btn-grad" onclick="handleLogin()" style="margin-bottom:10px;">INICIAR SESIÓN</button>
    <button class="chip" style="width:100%; padding:10px;" onclick="handleSignUp()">Crear Cuenta Nueva</button>
  </div>
</div>

<!-- 2. HEADER -->
<header class="header">
  <div class="brand">
    <img src="https://picsum.photos/200/200?random=88" alt="Logo" class="brand-logo-img">
    <span>OnlyBubble<span class="gradient-text">VR</span></span>
  </div>
  <button class="chip" onclick="handleLogout()">🚪 Salir</button>
</header>

<!-- 3. CONTENIDO PRINCIPAL (SPA) -->
<div class="app-body">

  <!-- PÁGINA 1: FEED DE SEGUIDOS / INICIO -->
  <section id="feed" class="page active">
    <div class="create-post-card">
      <div style="display:flex; gap:10px; align-items:center;">
        <img src="https://picsum.photos/100/100?random=99" style="width:36px; height:36px; border-radius:50%;" alt="User">
        <input type="text" id="postInput" placeholder="¿Qué mundo de VRChat estás visitando?" style="flex:1; background:none; border:none; color:#fff; font-size:13px; outline:none;">
        <button class="chip active" onclick="publishPost()">Publicar</button>
      </div>
    </div>

    <h3 style="font-size:15px; color:var(--text-muted); margin-bottom:12px;">Publicaciones de la comunidad</h3>
    <div id="postsContainer">Cargando publicaciones...</div>
  </section>

  <!-- PÁGINA 2: DISCOVER / BURBUJAS -->
  <section id="discover" class="page">
    <div style="text-align:center; padding:40px 0; color:var(--text-muted);">
      <h2>🫧 Sección Burbujas</h2>
      <p style="font-size:13px; margin-top:8px;">Buscando avatares y usuarios conectados...</p>
    </div>
  </section>

  <!-- PÁGINA 3: PERFIL DE USUARIO -->
  <section id="profile" class="page">
    <div class="post-card" style="text-align:center;">
      <img src="https://picsum.photos/150/150?random=99" style="width:80px; height:80px; border-radius:50%; border:2px solid var(--neon-cyan); margin-bottom:8px;" alt="Me">
      <h2 id="profileEmail">Usuario</h2>
      <p style="font-size:12px; color:var(--text-muted);">VRChat User</p>
    </div>
  </section>

</div>

<!-- NAVBAR INFERIOR -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('feed', this)"><span class="icon">📰</span><span>Inicio</span></button>
  <button class="nav-btn" onclick="switchTab('discover', this)"><span class="icon">🫧</span><span>Burbujas</span></button>
  <button class="nav-btn" onclick="switchTab('profile', this)"><span class="icon">👤</span><span>Perfil</span></button>
</nav>

<script>
  // CONFIGURACIÓN SUPABASE CONECTADA
  const SUPABASE_URL = "https://wzpmgtkabsncpzpvweja.supabase.co";
  const SUPABASE_KEY = "sb_publishable_y9Yrqzf1QabeTeQV4DauBQ_tWgrL0li";
  
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // COMPROBAR SESIÓN ACTIVA
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      hideAuthScreen();
      loadPosts();
      document.getElementById('profileEmail').innerText = session.user.email;
    }
  });

  // LOGIN
  async function handleLogin() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPass').value;

    if (!email || !password) return alert("Escribe tu correo y contraseña");

    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) return alert("Error al iniciar sesión: " + error.message);

    document.getElementById('profileEmail').innerText = data.user.email;
    hideAuthScreen();
    loadPosts();
  }

  // REGISTRO
  async function handleSignUp() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPass').value;

    if (!email || !password) return alert("Escribe tu correo y contraseña para registrarte");

    const { data, error } = await db.auth.signUp({ email, password });
    if (error) return alert("Error al registrarse: " + error.message);
    
    alert("¡Cuenta creada correctamente! Revisa tu correo si activaste confirmación en Supabase.");
  }

  // LOGOUT
  async function handleLogout() {
    await db.auth.signOut();
    const authScreen = document.getElementById('auth-screen');
    authScreen.style.display = 'flex';
    authScreen.classList.remove('hide');
  }

  function hideAuthScreen() {
    const authScreen = document.getElementById('auth-screen');
    authScreen.classList.add('hide');
    setTimeout(() => { authScreen.style.display = 'none'; }, 600);
  }

  // NAVEGACIÓN ENTRE PÁGINAS
  function switchTab(tabId, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    if(btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    document.getElementById(tabId).classList.add('active');
  }

  // OBTENER PUBLICACIONES DE SUPABASE
  async function loadPosts() {
    const container = document.getElementById('postsContainer');
    const { data: posts, error } = await db.from('posts').select('*').order('created_at', { ascending: false });

    if (error) {
      container.innerHTML = `<p style="color:var(--text-muted); font-size:12px;">Error cargando publicaciones: ${error.message}</p>`;
      return;
    }

    if (!posts || posts.length === 0) {
      container.innerHTML = `<p style="color:var(--text-muted); font-size:13px; text-align:center;">Aún no hay publicaciones creadas.</p>`;
      return;
    }

    container.innerHTML = posts.map(post => `
      <div class="post-card">
        <div class="post-header">
          <img src="https://picsum.photos/100/100?random=${post.id}" class="post-avatar" alt="Avatar">
          <div>
            <b style="font-size:14px;">Usuario VR</b>
            <p style="font-size:10px; color:var(--text-muted);">${new Date(post.created_at).toLocaleTimeString()}</p>
          </div>
        </div>
        <p style="font-size:13px; line-height:1.4;">${post.content}</p>
      </div>
    `).join('');
  }

  // GUARDAR PUBLICACIÓN EN SUPABASE
  async function publishPost() {
    const input = document.getElementById('postInput');
    const text = input.value.trim();
    if(!text) return;

    const { data: { session } } = await db.auth.getSession();
    if (!session) return alert("Debes iniciar sesión para publicar");

    const { error } = await db.from('posts').insert([
      { content: text, user_id: session.user.id }
    ]);

    if (error) return alert("Error al publicar: " + error.message);

    input.value = '';
    loadPosts();
  }
</script>
</body>
</html>
